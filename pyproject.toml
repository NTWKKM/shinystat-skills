[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medstat"
version = "0.1.0"
description = "Headless biostatistical calculation engine and CLI for clinical research"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Clinical Biostatistics Core Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0,<4.0.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "lifelines>=0.29.0",
    "firthmodels>=0.8.2",
    "patsy>=0.5.6",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "plotly>=5.18.0",
]

[project.optional-dependencies]
causal = [
    "econml>=0.15.0",
    "psmpy>=0.3.0",
    "shap>=0.45.0",
]
pdf = [
    "playwright>=1.40.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[project.scripts]
medstat = "medstat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/medstat"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow",
    "unit: marks unit tests",
    "integration: marks integration tests",
    "e2e: marks CLI end-to-end tests",
    "benchmark: marks numerical parity benchmark tests against R",
]
