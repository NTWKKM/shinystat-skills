version: "1.0"

metadata:
  study_title: "Cardiovascular Risk Reduction with Statin Therapy: Clinical Registry Analysis"
  protocol_id: "MEDSTAT-CVD-2026-SAP"
  analyst: "Clinical Biostatistics Core"
  date: "2026-09-23"
  reporting_guideline: "STROBE"
  study_design: "retrospective_cohort"

data:
  input_path: "tests/fixtures/cardiovascular_cohort.csv"
  id_column: "patient_id"
  filters:
    - expression: "age >= 45"
      reason: "Pediatric and young adult patients excluded (< 45 years)"
    - expression: "sbp > 90"
      reason: "Patients with acute hypotension excluded (SBP <= 90 mmHg)"

variables:
  - name: "cv_event"
    label: "3-Year Major Adverse Cardiovascular Event (MACE)"
    role: "outcome"
    data_type: "binary"
    categories: [0, 1]
    reference_category: 0

  - name: "statin_rx"
    label: "High-Intensity Statin Prescription at Baseline"
    role: "exposure"
    data_type: "binary"
    categories: [0, 1]
    reference_category: 0

  - name: "age"
    label: "Baseline Age (years)"
    role: "covariate"
    data_type: "continuous"

  - name: "sbp"
    label: "Systolic Blood Pressure (mmHg)"
    role: "covariate"
    data_type: "continuous"

  - name: "ldl"
    label: "Low-Density Lipoprotein Cholesterol (mg/dL)"
    role: "covariate"
    data_type: "continuous"

  - name: "diabetes"
    label: "Pre-existing Type 2 Diabetes"
    role: "covariate"
    data_type: "binary"
    categories: [0, 1]
    reference_category: 0

  - name: "bmi"
    label: "Body Mass Index (kg/m^2)"
    role: "covariate"
    data_type: "continuous"

models:
  - name: "mace_primary_logistic"
    description: "Multivariable logistic regression of 3-year MACE on statin therapy"
    type: "logistic"
    outcome: "cv_event"
    exposure: "statin_rx"
    covariates:
      - "age"
      - "sbp"
      - "ldl"
      - "diabetes"
    formula: "cv_event ~ statin_rx + age + sbp + ldl + diabetes"
    reference_categories:
      statin_rx: 0
      diabetes: 0
    missing_strategy: "complete-case"
    missing_justification: "Complete-case analysis under MCAR assumption with <5% missingness in baseline variables"
    options:
      ci_method: "wald"
      e_value: true

reporting:
  style: "nejm"
  format: "html"
  include_narrative: true
  include_flow_diagram: true
